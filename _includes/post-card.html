<article class="post-card">
  <a class="post-card__image-link" href="{{ include.post.url | relative_url }}">
    {% if include.post.image %}
      <img class="post-card__image" src="{{ include.post.image | relative_url }}" alt="{{ include.post.title }}" loading="lazy">
    {% else %}
      <span class="post-card__image post-card__image--placeholder"></span>
    {% endif %}
  </a>

  <div class="post-card__body">
    <p class="eyebrow eyebrow--pill">{{ include.post.category | upcase }}</p>
    <h3 class="post-card__title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p class="post-card__desc">{{ include.post.description }}</p>

    <div class="post-card__meta">
      <span>{{ include.post.date | date: "%d %b %Y" }}{% if include.post.read_time %} · {{ include.post.read_time }}{% endif %}</span>
      <a class="post-card__read" href="{{ include.post.url | relative_url }}">ler →</a>
    </div>
  </div>
</article>
