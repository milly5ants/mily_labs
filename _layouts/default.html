<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if page.title %}
            {{ page.title }} · {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta
        name="description"
        content="{{ page.description | default: site.description }}"
    >

    <link
        rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}"
    >

</head>

<body>

<header class="site-header">

    <div class="container header-content">

        <a
            href="{{ '/' | relative_url }}"
            class="logo"
        >
            jaja <span>♡</span>
        </a>

        <nav class="navigation">

            <a href="{{ '/' | relative_url }}">
                início
            </a>

            <a href="{{ '/projetos/' | relative_url }}">
                projetos
            </a>

            <a href="{{ '/sobre/' | relative_url }}">
                sobre
            </a>

        </nav>

    </div>

</header>


<main>

    {{ content }}

</main>


<footer class="site-footer">

    <div class="container footer-content">

        <span>
            © {{ site.time | date: "%Y" }} Jaja
        </span>

        <span>
            feito com ☕ e código
        </span>

    </div>

</footer>

</body>

</html>
