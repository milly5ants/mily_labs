<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta
        name="description"
        content="{{ site.description }}"
    >

    <link
        rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}"
    >

</head>


<body>

<header class="header">

    <div class="header-inner">

        <a
            class="logo"
            href="{{ '/' | relative_url }}"
        >
            jaja <span>♡</span>
        </a>


        <nav class="nav">

            <a href="{{ '/' | relative_url }}">
                início
            </a>

            <a href="{{ '/#posts' | relative_url }}">
                posts
            </a>

            <a href="{{ '/projetos/' | relative_url }}">
                projetos
            </a>

            <a href="{{ '/sobre/' | relative_url }}">
                sobre
            </a>

            <span class="nav-icon">☼</span>

            <span class="nav-icon">⌕</span>

        </nav>

    </div>

</header>


<main>

    {{ content }}

</main>


<footer class="footer">

    <div class="footer-inner">

        <span>
            © {{ 'now' | date: "%Y" }} Jaja
        </span>

        <span>
            feito com ☕ e código
        </span>

    </div>

</footer>


</body>

</html>
