---
layout: default
---

<article class="single-post">

    <div class="single-post-header">

        {% if page.category %}
            <span class="post-tag">
                {{ page.category }}
            </span>
        {% endif %}

        <h1>
            {{ page.title }}
        </h1>

        <div class="single-post-date">
            {{ page.date | date: "%d/%m/%Y" }}
        </div>

    </div>


    <div class="single-post-content">

        {{ content }}

    </div>

</article>
