---
layout: default
---
<article class="post-page">
  <div class="wrap post-page__wrap">
    <a class="back-link" href="{{ '/posts/' | relative_url }}">← voltar para posts</a>

    <p class="eyebrow eyebrow--pill post-page__category">{{ page.category }}</p>

    <h1 class="post-page__title">{{ page.title }}</h1>

    <p class="post-page__meta">
      {{ page.date | date: "%d %b %Y" }}
      {% if page.read_time %} · {{ page.read_time }}{% endif %}
    </p>

    {% if page.image %}
    <div class="post-page__image">
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    </div>
    {% endif %}

    <div class="post-page__content">
      {{ content }}
    </div>

    <a class="back-link back-link--bottom" href="{{ '/posts/' | relative_url }}">← voltar para posts</a>
  </div>
</article>
