---
layout: default
---

<article class="post-page">

    <div class="container post-container">

        <div class="post-meta">

            <span class="post-category">
                {{ page.category }}
            </span>

            <span>
                {{ page.date | date: "%d/%m/%Y" }}
            </span>

        </div>


        <h1 class="post-title">
            {{ page.title }}
        </h1>


        {% if page.description %}

        <p class="post-description">
            {{ page.description }}
        </p>

        {% endif %}


        {% if page.image %}

        <img
            class="post-cover"
            src="{{ page.image | relative_url }}"
            alt="{{ page.title }}"
        >

        {% endif %}


        <div class="post-content">

            {{ content }}

        </div>

    </div>

</article>
